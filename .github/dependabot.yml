version: 2
updates:
  # Python dependencies (pyproject.toml / constraints.txt)
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    # Cooling-off: don't propose a release until it has been public for 14 days.
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
  # Pinned GitHub Actions SHAs in .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege for the workflow token: CI only needs to read the repo.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      # Actions are pinned to a full commit SHA (tags can be moved); Dependabot bumps them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests/ -v
      # Packaging check: the wheel must build and expose the `forma-mcp` entry point
      # that `uvx --from git+…@<tag> forma-mcp` runs.
      - run: pip install build && python -m build
      - run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl
          test -x /tmp/wheel-venv/bin/forma-mcp
          cd /tmp && /tmp/wheel-venv/bin/python -c "import aps_mcp; assert callable(aps_mcp.run)"

  # Supply chain: the pinned dependency set users install (constraints.txt) must
  # install hash-verified and carry no known vulnerabilities.
  audit:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the pinned set with hash verification
        run: |
          python -m venv /tmp/pinned
          /tmp/pinned/bin/pip install --require-hashes -r constraints.txt
          /tmp/pinned/bin/pip install --no-deps .
          cd /tmp && /tmp/pinned/bin/python -c "import aps_mcp; assert callable(aps_mcp.run)"
      - name: Scan for known vulnerabilities
        run: |
          pip install pip-audit
          pip-audit -r constraints.txt --require-hashes --strict

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests/ -v
      # Packaging check: the wheel must build and expose the `forma-mcp` entry point
      # that `uvx --from git+…@<tag> forma-mcp` runs.
      - run: pip install build && python -m build
      - run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl
          test -x /tmp/wheel-venv/bin/forma-mcp
          cd /tmp && /tmp/wheel-venv/bin/python -c "import aps_mcp; assert callable(aps_mcp.run)"
